name: Fix And Build

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: Fix SstpVpnService.kt
      run: |
        python3 << 'PYEOF'
        path = 'app/src/main/java/com/sstpvpn/android/vpn/SstpVpnService.kt'
        with open(path) as f:
            lines = f.readlines()
        result = []
        i = 0
        while i < len(lines):
            line = lines[i]
            if 'val r = "SSTP_DUPLEX_POST' in line:
                result.append('        val sb = StringBuilder()\n')
                result.append('        sb.append("SSTP_DUPLEX_POST /sra_{BA195980-CD49-458b-9E23-C84EE0ADCD75}/ HTTP/1.1\\r\\n")\n')
                result.append('        sb.append("SSTPCORRELATIONID: {").append(uuid).append("}\\r\\n")\n')
                result.append('        sb.append("Content-Length: 18446744073709551615\\r\\n")\n')
                result.append('        sb.append("Host: ").append(host).append("\\r\\n")\n')
                result.append('        sb.append("\\r\\n")\n')
                i += 1
                while i < len(lines) and 'out.write' not in lines[i]:
                    i += 1
                result.append('        out.write(sb.toString().toByteArray())\n')
                result.append('        out.flush()\n')
                i += 1
            else:
                result.append(line)
                i += 1
        with open(path, 'w') as f:
            f.writelines(result)
        print('Done! Lines:', len(result))
        PYEOF

    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - uses: android-actions/setup-android@v3

    - name: Download gradle-wrapper.jar
      run: |
        mkdir -p gradle/wrapper
        curl -fL https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar

    - run: chmod +x gradlew

    - name: Build APK
      run: ./gradlew assembleDebug 2>&1 | head -80

    - name: Commit fix
      run: |
        git config user.email "actions@github.com"
        git config user.name "GitHub Actions"
        git add -A
        git commit -m "Fix SstpVpnService.kt" || true
        git push || true

    - uses: actions/upload-artifact@v4
      if: success()
      with:
        name: sstp-vpn-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
