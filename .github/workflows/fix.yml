name: Build SSTP VPN

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Clone Open-SSTP-Client
      run: git clone --depth=1 https://github.com/kittoku/Open-SSTP-Client.git app_source

    - name: Patch defaults
      run: |
        python3 << 'PYEOF'
        base = 'app_source'
        path = base+'/app/src/main/java/kittoku/osc/preference/constant.kt'
        with open(path) as f:
            c = f.read()
        c = c.replace('OscPrefKey.HOME_HOSTNAME to EMPTY_TEXT,', 'OscPrefKey.HOME_HOSTNAME to "64.188.69.242",')
        c = c.replace('OscPrefKey.HOME_USERNAME to EMPTY_TEXT,', 'OscPrefKey.HOME_USERNAME to "tel",')
        c = c.replace('OscPrefKey.HOME_PASSWORD to EMPTY_TEXT,', 'OscPrefKey.HOME_PASSWORD to "H78fgk159s",')
        c = c.replace('OscPrefKey.SSL_DO_VERIFY to true,', 'OscPrefKey.SSL_DO_VERIFY to false,')
        with open(path,'w') as f:
            f.write(c)
        path = base+'/app/build.gradle'
        with open(path) as f:
            c = f.read()
        c = c.replace('applicationId "kittoku.osc"', 'applicationId "com.sstpvpn.client"')
        with open(path,'w') as f:
            f.write(c)
        path = base+'/app/src/main/res/values/strings.xml'
        with open(path) as f:
            c = f.read()
        c = c.replace('Open SSTP Client', 'SSTP VPN')
        with open(path,'w') as f:
            f.write(c)
        print('Patched OK')
        PYEOF

    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - uses: android-actions/setup-android@v3

    - name: Build APK
      working-directory: app_source
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug

    - uses: actions/upload-artifact@v4
      with:
        name: sstp-vpn-debug
        path: app_source/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
