name: Build SSTP VPN Fixed

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Clone Open-SSTP-Client
      run: git clone --depth=1 https://github.com/kittoku/Open-SSTP-Client.git app_source

    - name: Apply OSC patches inline
      run: |
        B=app_source
        SVC=$B/app/src/main/java/kittoku/osc/service/SstpVpnService.kt
        CP=$B/app/src/main/java/kittoku/osc/preference/constant.kt
        # Make SstpVpnService public
        sed -i 's/internal class SstpVpnService/class SstpVpnService/g' $SVC
        sed -i 's/internal const val ACTION_VPN_CONNECT/const val ACTION_VPN_CONNECT/g' $SVC
        sed -i 's/internal const val ACTION_VPN_DISCONNECT/const val ACTION_VPN_DISCONNECT/g' $SVC
        # Make ALL internal types in constant.kt public (OscPrefKey enum etc)
        sed -i 's/^internal //' $CP
        # Make accessor functions public
        find $B/app/src/main/java/kittoku/osc/preference/accessor -name '*.kt' -exec sed -i 's/internal fun /fun /g' {} \;
        # Fix SSL verify
        sed -i 's/OscPrefKey.SSL_DO_VERIFY to true,/OscPrefKey.SSL_DO_VERIFY to false,/g' $CP
        # Add companion object to SstpVpnService
        python3 - << 'PYEOF'
        import os
        svc='app_source/app/src/main/java/kittoku/osc/service/SstpVpnService.kt'
        c=open(svc).read()
        if 'companion object' not in c:
            comp='\n    companion object {\n        var isRunning = false\n        var statusCallback: ((String) -> Unit)? = null\n    }\n\n'
            c=c.replace('class SstpVpnService : VpnService() {\n','class SstpVpnService : VpnService() {'+comp)
        old='    private fun setRootState(state: Boolean) {\n        setBooleanPrefValue(state, OscPrefKey.ROOT_STATE, prefs)\n    }'
        new='    private fun setRootState(state: Boolean) {\n        setBooleanPrefValue(state, OscPrefKey.ROOT_STATE, prefs)\n        isRunning = state\n        if (!state) statusCallback?.invoke("Disconnected")\n    }'
        c=c.replace(old,new)
        open(svc,'w').write(c)
        # Update applicationId and add dependencies
        bg='app_source/app/build.gradle'
        c=open(bg).read().replace('applicationId "kittoku.osc"','applicationId "com.sstpvpn.client"')
        if 'gson' not in c:
            extra="    implementation 'com.google.code.gson:gson:2.10.1'\n    implementation 'androidx.cardview:cardview:1.0.0'\n    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'\n    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.2'\n    implementation 'androidx.recyclerview:recyclerview:1.3.2'\n"
            c=c.replace("    testImplementation 'junit:junit:4.13.2'",extra+"    testImplementation 'junit:junit:4.13.2'")
        open(bg,'w').write(c)
        print('Patches done!')
        PYEOF

    - name: Apply UI patches from repo
      run: |
        curl -sL https://raw.githubusercontent.com/smtplexxis-glitch/sstp-vpn-android/main/patch_script.py.b64 -o /tmp/s.b64
        base64 -d /tmp/s.b64 > /tmp/patch.py 2>/dev/null && python3 /tmp/patch.py || echo "UI patch skipped"

    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - uses: android-actions/setup-android@v3

    - name: Build APK
      working-directory: app_source
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug 2>&1 | tail -100

    - uses: actions/upload-artifact@v4
      with:
        name: sstp-vpn-fixed
        path: app_source/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
