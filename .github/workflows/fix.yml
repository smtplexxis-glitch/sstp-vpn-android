name: Fix And Build

on:
  workflow_dispatch:

jobs:
  fix-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: Fix all broken strings
      run: |
        python3 << 'PYEOF'
        path = 'app/src/main/java/com/sstpvpn/android/vpn/SstpVpnService.kt'
        with open(path) as f:
            content = f.read()
        lines = content.split('\n')
        result = []
        i = 0
        while i < len(lines):
            line = lines[i]
            # Fix broken sendHttpConnect (val r = ...)
            if 'val r = "SSTP_DUPLEX_POST' in line:
                result.append('        val sb = StringBuilder()')
                result.append('        sb.append("SSTP_DUPLEX_POST /sra_{BA195980-CD49-458b-9E23-C84EE0ADCD75}/ HTTP/1.1\\r\\n")')
                result.append('        sb.append("SSTPCORRELATIONID: {").append(uuid).append("}\\r\\n")')
                result.append('        sb.append("Content-Length: 18446744073709551615\\r\\n")')
                result.append('        sb.append("Host: ").append(host).append("\\r\\n")')
                result.append('        sb.append("\\r\\n")')
                i += 1
                while i < len(lines) and 'out.write' not in lines[i]:
                    i += 1
                result.append('        out.write(sb.toString().toByteArray())')
                result.append('        out.flush()')
                i += 1
            # Fix broken readHttpResponse char comparison
            elif "b == '" in line and 'inp.read' not in line and len(line.strip()) < 10:
                # skip these broken lines
                i += 1
            elif 'if (b ==' in line and '\\r' not in line and 'break' in line:
                # Replace with numeric version
                result.append('            if (b == 13.toChar() && c == 10.toChar() && a == 13.toChar() && d == 10.toChar()) break')
                i += 1
            else:
                result.append(line)
                i += 1
        with open(path, 'w') as f:
            f.write('\n'.join(result))
        # Verify
        with open(path) as f:
            new = f.read()
        problems = [i+1 for i,l in enumerate(new.split('\n')) if l.strip() in ["'", "' &&"]]
        print(f'Fixed! Lines: {len(new.split(chr(10)))}, problems: {problems[:5]}')
        PYEOF

    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - uses: android-actions/setup-android@v3

    - name: Download gradle-wrapper.jar
      run: |
        mkdir -p gradle/wrapper
        curl -fL https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar

    - run: chmod +x gradlew

    - name: Build APK
      run: ./gradlew assembleDebug

    - name: Commit fix
      run: |
        git config user.email "actions@github.com"
        git config user.name "GitHub Actions"
        git add -A && git commit -m "Fix all broken strings" || true
        git push || true

    - uses: actions/upload-artifact@v4
      with:
        name: sstp-vpn-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
