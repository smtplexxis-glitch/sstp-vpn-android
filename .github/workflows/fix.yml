name: Build SSTP VPN Custom UI

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Clone Open-SSTP-Client
      run: git clone --depth=1 https://github.com/kittoku/Open-SSTP-Client.git app_source

    - name: Download and run patch script
      run: |
        curl -sL https://raw.githubusercontent.com/smtplexxis-glitch/sstp-vpn-android/main/patch_script.py.b64 -o /tmp/s.b64
        base64 -d /tmp/s.b64 > /tmp/patch.py
        python3 /tmp/patch.py

    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - uses: android-actions/setup-android@v3

    - name: Build APK
      working-directory: app_source
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug 2>&1 | tail -50

    - uses: actions/upload-artifact@v4
      with:
        name: sstp-vpn-custom-ui
        path: app_source/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
